<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-obs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title Block -->
  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Customer Churn Prediction API — System Architecture</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">End-to-end request lifecycle, schema validation, ML pipeline inference, and operational observability</text>

  <!-- Section 1: Client Layer -->
  <g transform="translate(40, 100)">
    <rect width="200" height="520" rx="12" fill="url(#grad-client)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#drop-shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700" letter-spacing="0.5">1. CLIENT LAYER</text>
    
    <!-- Client Nodes -->
    <g transform="translate(15, 60)">
      <rect width="170" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="30" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">External Client</text>
      <text x="85" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">cURL / Python requests</text>
      <text x="85" y="65" text-anchor="middle" fill="#64748b" font-size="10">HTTP POST /predict</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="170" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="30" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Swagger UI</text>
      <text x="85" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Interactive Browser Docs</text>
      <text x="85" y="65" text-anchor="middle" fill="#38bdf8" font-size="10">GET /docs</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="28" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Health Monitors</text>
      <text x="85" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Render / K8s Probes</text>
      <text x="85" y="60" text-anchor="middle" fill="#34d399" font-size="10">GET /health</text>
    </g>

    <g transform="translate(15, 350)">
      <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="28" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Telemetry Consumers</text>
      <text x="85" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">DevOps / Prometheus</text>
      <text x="85" y="60" text-anchor="middle" fill="#fbbf24" font-size="10">GET /metrics</text>
    </g>

    <!-- Client Legend Info -->
    <rect x="15" y="435" width="170" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="455" fill="#94a3b8" font-size="11" font-weight="600">Protocols:</text>
    <text x="25" y="473" fill="#cbd5e1" font-size="10">• JSON over HTTP/1.1</text>
    <text x="25" y="490" fill="#cbd5e1" font-size="10">• UTF-8 encoded payloads</text>
  </g>

  <!-- Section 2: Serving & Validation Layer -->
  <g transform="translate(280, 100)">
    <rect width="240" height="520" rx="12" fill="url(#grad-api)" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#drop-shadow)"/>
    <text x="120" y="32" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="0.5">2. FASTAPI & ASGI</text>

    <!-- ASGI Server -->
    <g transform="translate(15, 55)">
      <rect width="210" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="105" y="26" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Uvicorn ASGI Server</text>
      <text x="105" y="45" text-anchor="middle" fill="#a5f3fc" font-size="11">Host 0.0.0.0 | Port 8000</text>
    </g>

    <!-- FastAPI Core -->
    <g transform="translate(15, 130)">
      <rect width="210" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="105" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">FastAPI Application</text>
      <text x="105" y="45" text-anchor="middle" fill="#94a3b8" font-size="11">Lifespan Context Manager</text>
      <text x="105" y="63" text-anchor="middle" fill="#38bdf8" font-size="10">Loads pipeline.bin at boot</text>
    </g>

    <!-- Pydantic Schema Validation -->
    <g transform="translate(15, 225)">
      <rect width="210" height="105" rx="8" fill="#1e293b" stroke="#0891b2" stroke-width="1.5"/>
      <text x="105" y="24" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Pydantic v2 Validation</text>
      <text x="105" y="44" text-anchor="middle" fill="#a5f3fc" font-size="11">Customer Schema</text>
      <text x="105" y="63" text-anchor="middle" fill="#94a3b8" font-size="10">19 typed fields | tenure ≥ 0</text>
      <text x="105" y="80" text-anchor="middle" fill="#94a3b8" font-size="10">monthlycharges ≥ 0</text>
      <text x="105" y="97" text-anchor="middle" fill="#38bdf8" font-size="10">customer.model_dump()</text>
    </g>

    <!-- 422 Error Path -->
    <g transform="translate(15, 350)">
      <rect width="210" height="55" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.2"/>
      <text x="105" y="24" text-anchor="middle" fill="#fecaca" font-size="12" font-weight="600">Validation Failure</text>
      <text x="105" y="43" text-anchor="middle" fill="#fca5a5" font-size="11">HTTP 422 Unprocessable</text>
    </g>

    <!-- Performance Counter -->
    <g transform="translate(15, 425)">
      <rect width="210" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="105" y="25" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Latency Profiling</text>
      <text x="105" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">time.perf_counter() start</text>
      <text x="105" y="63" text-anchor="middle" fill="#34d399" font-size="10">finally: record elapsed ms</text>
    </g>
  </g>

  <!-- Section 3: Machine Learning Engine -->
  <g transform="translate(560, 100)">
    <rect width="250" height="520" rx="12" fill="url(#grad-ml)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#drop-shadow)"/>
    <text x="125" y="32" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700" letter-spacing="0.5">3. ML PIPELINE IN RAM</text>

    <!-- Serialized Pipeline Container -->
    <g transform="translate(15, 55)">
      <rect width="220" height="85" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="110" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">models['pipeline']</text>
      <text x="110" y="45" text-anchor="middle" fill="#e9d5ff" font-size="11">scikit-learn make_pipeline</text>
      <text x="110" y="63" text-anchor="middle" fill="#94a3b8" font-size="10">Loaded once into memory</text>
      <text x="110" y="77" text-anchor="middle" fill="#a78bfa" font-size="9">Thread-safe concurrent reads</text>
    </g>

    <!-- DictVectorizer Step -->
    <g transform="translate(15, 155)">
      <rect width="220" height="75" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="110" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">DictVectorizer</text>
      <text x="110" y="45" text-anchor="middle" fill="#c4b5fd" font-size="11">sparse=False</text>
      <text x="110" y="65" text-anchor="middle" fill="#94a3b8" font-size="10">Encodes categorical strings</text>
    </g>

    <!-- LogisticRegression Step -->
    <g transform="translate(15, 245)">
      <rect width="220" height="85" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="110" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">LogisticRegression</text>
      <text x="110" y="45" text-anchor="middle" fill="#c4b5fd" font-size="11">C=0.5, max_iter=5000</text>
      <text x="110" y="65" text-anchor="middle" fill="#94a3b8" font-size="10">predict_proba([features])[0, 1]</text>
      <text x="110" y="78" text-anchor="middle" fill="#a78bfa" font-size="9">Trained AUC = 0.857</text>
    </g>

    <!-- Thresholding Logic -->
    <g transform="translate(15, 345)">
      <rect width="220" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="110" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Decision Threshold</text>
      <text x="110" y="45" text-anchor="middle" fill="#e9d5ff" font-size="11">threshold = 0.5</text>
      <text x="110" y="65" text-anchor="middle" fill="#34d399" font-size="10">churn = probability ≥ 0.5</text>
    </g>

    <!-- Internal Error Boundary -->
    <g transform="translate(15, 435)">
      <rect width="220" height="65" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.2"/>
      <text x="110" y="24" text-anchor="middle" fill="#fecaca" font-size="12" font-weight="600">Exception Catch Block</text>
      <text x="110" y="42" text-anchor="middle" fill="#fca5a5" font-size="11">HTTP 500 Internal Error</text>
      <text x="110" y="57" text-anchor="middle" fill="#cbd5e1" font-size="9">logger.exception() + err_count++</text>
    </g>
  </g>

  <!-- Section 4: Response & Observability -->
  <g transform="translate(850, 100)">
    <rect width="210" height="520" rx="12" fill="url(#grad-obs)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#drop-shadow)"/>
    <text x="105" y="32" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700" letter-spacing="0.5">4. OBSERVABILITY</text>

    <!-- Prediction Response -->
    <g transform="translate(15, 55)">
      <rect width="180" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="90" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">PredictionResponse</text>
      <text x="90" y="45" text-anchor="middle" fill="#6ee7b7" font-size="11">HTTP 200 OK</text>
      <text x="90" y="65" text-anchor="middle" fill="#94a3b8" font-size="10">churn_prob: float</text>
      <text x="90" y="82" text-anchor="middle" fill="#34d399" font-size="10">churn: bool (true/false)</text>
    </g>

    <!-- Structured Logging -->
    <g transform="translate(15, 165)">
      <rect width="180" height="105" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="90" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Python Logging</text>
      <text x="90" y="45" text-anchor="middle" fill="#94a3b8" font-size="10">asctime | level | msg</text>
      <text x="90" y="63" text-anchor="middle" fill="#cbd5e1" font-size="9">• Model loaded</text>
      <text x="90" y="80" text-anchor="middle" fill="#cbd5e1" font-size="9">• Request latency (sec)</text>
      <text x="90" y="97" text-anchor="middle" fill="#fca5a5" font-size="9">• Exception tracebacks</text>
    </g>

    <!-- In-Memory Metrics -->
    <g transform="translate(15, 285)">
      <rect width="180" height="120" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
      <text x="90" y="25" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Telemetry Metrics</text>
      <text x="90" y="45" text-anchor="middle" fill="#34d399" font-size="11">GET /metrics</text>
      <text x="90" y="65" text-anchor="middle" fill="#cbd5e1" font-size="9">• prediction_count</text>
      <text x="90" y="83" text-anchor="middle" fill="#cbd5e1" font-size="9">• error_count</text>
      <text x="90" y="101" text-anchor="middle" fill="#cbd5e1" font-size="9">• total_latency_seconds</text>
    </g>

    <!-- Future Scope Alert -->
    <g transform="translate(15, 420)">
      <rect width="180" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Planned Enhancements:</text>
      <text x="90" y="42" text-anchor="middle" fill="#64748b" font-size="9">Prometheus Exporter</text>
      <text x="90" y="58" text-anchor="middle" fill="#64748b" font-size="9">Grafana Dashboard</text>
      <text x="90" y="74" text-anchor="middle" fill="#64748b" font-size="9">Persistent Time-Series</text>
    </g>
  </g>

  <!-- Connective Arrows & Data Flows -->
  <!-- Client to Uvicorn -->
  <path d="M 225 195 L 295 195" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <!-- FastAPI to Validation -->
  <path d="M 400 205 L 400 225" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Validation to 422 -->
  <path d="M 380 330 L 380 350" fill="none" stroke="#f87171" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  
  <!-- Validation to Pipeline (Valid payload) -->
  <path d="M 505 280 L 575 280" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- DictVectorizer to LogisticRegression -->
  <path d="M 685 230 L 685 245" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- LogisticRegression to Threshold -->
  <path d="M 685 330 L 685 345" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Pipeline to Exception Catch Block -->
  <path d="M 630 420 L 630 435" fill="none" stroke="#f87171" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- Threshold to PredictionResponse -->
  <path d="M 795 380 L 825 380 L 825 200 L 865 200" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Response return to Client -->
  <path d="M 955 200 L 955 80 L 140 80 L 140 160" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
</svg>