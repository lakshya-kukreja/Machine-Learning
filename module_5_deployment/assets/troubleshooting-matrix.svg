<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-drop2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="525" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">ML Deployment Troubleshooting &amp; Engineering Lessons</text>
  <text x="525" y="58" text-anchor="middle" fill="#94a3b8" font-size="12.5">Practical failure modes diagnosed and resolved during local containerization, testing, and cloud release</text>

  <!-- Table Container -->
  <g transform="translate(30, 80)" filter="url(#card-drop2)">
    <rect width="990" height="470" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Table Header Row -->
    <rect width="990" height="38" rx="10" fill="#1e293b"/>
    <text x="25" y="24" fill="#38bdf8" font-size="11.5" font-weight="700">SYMPTOM &amp; ERROR</text>
    <text x="260" y="24" fill="#38bdf8" font-size="11.5" font-weight="700">LIKELY ROOT CAUSE</text>
    <text x="520" y="24" fill="#38bdf8" font-size="11.5" font-weight="700">DIAGNOSTIC COMMAND</text>
    <text x="750" y="24" fill="#38bdf8" font-size="11.5" font-weight="700">ENGINEERING FIX</text>

    <!-- Row 1: Docker WSL -->
    <g transform="translate(0, 38)">
      <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="990" height="82" fill="#1e293b" fill-opacity="0.2"/>
      <text x="25" y="28" fill="#fca5a5" font-size="11" font-weight="700">Cannot connect to Docker daemon</text>
      <text x="25" y="46" fill="#94a3b8" font-size="10">unix:///var/run/docker.sock failed</text>

      <text x="260" y="28" fill="#cbd5e1" font-size="10.5">Docker CLI installed in WSL, but</text>
      <text x="260" y="44" fill="#cbd5e1" font-size="10.5">Docker Desktop daemon is stopped</text>
      <text x="260" y="60" fill="#cbd5e1" font-size="10.5">or WSL Integration is disabled.</text>

      <text x="520" y="28" fill="#38bdf8" font-family="monospace" font-size="10.5">docker version</text>
      <text x="520" y="46" fill="#38bdf8" font-family="monospace" font-size="10.5">docker info</text>

      <text x="750" y="28" fill="#a7f3d0" font-size="10.5">Start Docker Desktop on host.</text>
      <text x="750" y="44" fill="#a7f3d0" font-size="10.5">Enable Settings ➔ Resources ➔</text>
      <text x="750" y="60" fill="#a7f3d0" font-size="10.5">WSL Integration for your distro.</text>
    </g>

    <!-- Row 2: Localhost refused -->
    <g transform="translate(0, 120)">
      <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="25" y="28" fill="#fca5a5" font-size="11" font-weight="700">Connection Refused</text>
      <text x="25" y="46" fill="#94a3b8" font-size="10">Failed to connect to 127.0.0.1:8000</text>

      <text x="260" y="28" fill="#cbd5e1" font-size="10.5">Uvicorn server is not running or</text>
      <text x="260" y="44" fill="#cbd5e1" font-size="10.5">crashed during application startup.</text>

      <text x="520" y="28" fill="#38bdf8" font-family="monospace" font-size="10.5">curl -v http://localhost:8000/health</text>

      <text x="750" y="28" fill="#a7f3d0" font-size="10.5">Start server: uv run uvicorn app:app</text>
      <text x="750" y="44" fill="#a7f3d0" font-size="10.5">--reload. Keep terminal active.</text>
    </g>

    <!-- Row 3: Fragile Model Path -->
    <g transform="translate(0, 202)">
      <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="990" height="82" fill="#1e293b" fill-opacity="0.2"/>
      <text x="25" y="28" fill="#fca5a5" font-size="11" font-weight="700">FileNotFoundError: pipeline.bin</text>
      <text x="25" y="46" fill="#94a3b8" font-size="10">Failed when run from parent dir</text>

      <text x="260" y="28" fill="#cbd5e1" font-size="10.5">Relative path 'pipeline.bin' resolved</text>
      <text x="260" y="44" fill="#cbd5e1" font-size="10.5">against current working directory</text>
      <text x="260" y="60" fill="#cbd5e1" font-size="10.5">instead of the script file location.</text>

      <text x="520" y="28" fill="#38bdf8" font-family="monospace" font-size="10.5">pwd &amp;&amp; ls pipeline.bin</text>

      <text x="750" y="28" fill="#a7f3d0" font-size="10.5">Resolve paths anchored to script:</text>
      <text x="750" y="44" fill="#38bdf8" font-family="monospace" font-size="10">Path(__file__).resolve().parent</text>
      <text x="750" y="60" fill="#38bdf8" font-family="monospace" font-size="10">/ 'pipeline.bin'</text>
    </g>

    <!-- Row 4: Container Network Binding -->
    <g transform="translate(0, 284)">
      <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="25" y="28" fill="#fca5a5" font-size="11" font-weight="700">Container Unreachable from Host</text>
      <text x="25" y="46" fill="#94a3b8" font-size="10">Host port mapped but times out</text>

      <text x="260" y="28" fill="#cbd5e1" font-size="10.5">Uvicorn bound to 127.0.0.1 inside</text>
      <text x="260" y="44" fill="#cbd5e1" font-size="10.5">the container, dropping all external</text>
      <text x="260" y="60" fill="#cbd5e1" font-size="10.5">forwarded bridge network packets.</text>

      <text x="520" y="28" fill="#38bdf8" font-family="monospace" font-size="10.5">docker logs &lt;container-id&gt;</text>

      <text x="750" y="28" fill="#a7f3d0" font-size="10.5">Specify --host 0.0.0.0 in Dockerfile</text>
      <text x="750" y="44" fill="#a7f3d0" font-size="10.5">CMD to listen on all interfaces.</text>
    </g>

    <!-- Row 5: CI Gating vs Live Health -->
    <g transform="translate(0, 366)">
      <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="990" height="84" fill="#1e293b" fill-opacity="0.2"/>
      <text x="25" y="28" fill="#fca5a5" font-size="11" font-weight="700">CI Passes but Deploy Fails</text>
      <text x="25" y="46" fill="#94a3b8" font-size="10">GitHub green, Render 502/sleep</text>

      <text x="260" y="28" fill="#cbd5e1" font-size="10.5">CI only verifies test assertions in VM;</text>
      <text x="260" y="44" fill="#cbd5e1" font-size="10.5">cloud environments face cold-starts,</text>
      <text x="260" y="60" fill="#cbd5e1" font-size="10.5">port mapping, and RAM limits.</text>

      <text x="520" y="28" fill="#38bdf8" font-family="monospace" font-size="10.5">curl -v https://&lt;render-url&gt;/health</text>

      <text x="750" y="28" fill="#a7f3d0" font-size="10.5">Configure /health probes, set 60s</text>
      <text x="750" y="44" fill="#a7f3d0" font-size="10.5">client timeout for cold-start wakeups,</text>
      <text x="750" y="60" fill="#a7f3d0" font-size="10.5">and inspect Render deploy logs.</text>
    </g>
  </g>
</svg>