<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="flow-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">End-to-End Machine Learning Deployment Lifecycle</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="12.5">The four core engineering phases bridging offline experimentation to cloud production</text>

  <!-- Phase 1: Train & Serialize -->
  <g transform="translate(30, 85)">
    <rect width="240" height="245" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="240" height="36" rx="10" fill="#78350f"/>
    <text x="120" y="23" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="700">PHASE 1: TRAIN &amp; SERIALIZE</text>
    
    <text x="20" y="65" fill="#fde68a" font-size="11" font-weight="600">Data &amp; Pipeline Fitting</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="10">• Telco Customer Churn CSV</text>
    <text x="20" y="102" fill="#cbd5e1" font-size="10">• DictVectorizer + LogisticRegression</text>
    <text x="20" y="119" fill="#cbd5e1" font-size="10">• Hyperparameters: C=0.5, max_iter=5000</text>
    <text x="20" y="136" fill="#cbd5e1" font-size="10">• Evaluation: Test ROC-AUC = 0.857</text>
    
    <path d="M 20 152 L 220 152" stroke="#334155" stroke-width="1"/>

    <text x="20" y="175" fill="#fde68a" font-size="11" font-weight="600">Output Artifact</text>
    <text x="20" y="195" fill="#38bdf8" font-size="10.5" font-weight="600">pipeline.bin (2.6 KB)</text>
    <text x="20" y="212" fill="#94a3b8" font-size="9.5">Encapsulates encoding + estimator</text>
    <text x="20" y="228" fill="#34d399" font-size="9.5">Prevents training-serving skew</text>
  </g>

  <!-- Flow 1->2 -->
  <path d="M 270 207 L 300 207" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arr)"/>

  <!-- Phase 2: FastAPI Service & Schemas -->
  <g transform="translate(305, 85)">
    <rect width="240" height="245" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="240" height="36" rx="10" fill="#164e63"/>
    <text x="120" y="23" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="700">PHASE 2: FASTAPI SERVICE</text>

    <text x="20" y="65" fill="#a5f3fc" font-size="11" font-weight="600">Asynchronous Serving</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="10">• Lifespan startup artifact load</text>
    <text x="20" y="102" fill="#cbd5e1" font-size="10">• In-memory model reuse</text>
    <text x="20" y="119" fill="#cbd5e1" font-size="10">• Pydantic v2 Customer schema</text>
    <text x="20" y="136" fill="#cbd5e1" font-size="10">• Strict boundary guards (ge=0)</text>

    <path d="M 20 152 L 220 152" stroke="#334155" stroke-width="1"/>

    <text x="20" y="175" fill="#a5f3fc" font-size="11" font-weight="600">REST API Routes</text>
    <text x="20" y="195" fill="#38bdf8" font-size="10">GET /health  → 200 OK</text>
    <text x="20" y="212" fill="#38bdf8" font-size="10">POST /predict → prob &amp; decision</text>
    <text x="20" y="228" fill="#38bdf8" font-size="10">GET /metrics &amp; /docs (OpenAPI)</text>
  </g>

  <!-- Flow 2->3 -->
  <path d="M 545 207 L 575 207" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arr)"/>

  <!-- Phase 3: Containerization & Tests -->
  <g transform="translate(580, 85)">
    <rect width="240" height="245" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="240" height="36" rx="10" fill="#1e3a8a"/>
    <text x="120" y="23" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="700">PHASE 3: DOCKER &amp; TESTS</text>

    <text x="20" y="65" fill="#bfdbfe" font-size="11" font-weight="600">Quality &amp; Isolation</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="10">• pytest suite (test_app.py)</text>
    <text x="20" y="102" fill="#cbd5e1" font-size="10">• 422 boundary validation test</text>
    <text x="20" y="119" fill="#cbd5e1" font-size="10">• 405 HTTP method safety</text>
    <text x="20" y="136" fill="#cbd5e1" font-size="10">• uv sync --locked reproducibility</text>

    <path d="M 20 152 L 220 152" stroke="#334155" stroke-width="1"/>

    <text x="20" y="175" fill="#bfdbfe" font-size="11" font-weight="600">Docker Build Context</text>
    <text x="20" y="195" fill="#cbd5e1" font-size="10">• Base: python:3.13.11-slim</text>
    <text x="20" y="212" fill="#cbd5e1" font-size="10">• Copy astral-sh/uv binary</text>
    <text x="20" y="228" fill="#cbd5e1" font-size="10">• Cached dependency layers</text>
  </g>

  <!-- Flow 3->4 -->
  <path d="M 820 207 L 850 207" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flow-arr)"/>

  <!-- Phase 4: Gated CI/CD & Production -->
  <g transform="translate(855, 85)">
    <rect width="215" height="245" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="215" height="36" rx="10" fill="#064e3b"/>
    <text x="107" y="23" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="700">PHASE 4: CI/CD &amp; CLOUD</text>

    <text x="15" y="65" fill="#a7f3d0" font-size="11" font-weight="600">Automated Release Gate</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="10">• GitHub Actions (ml-tests.yml)</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="10">• Push/PR trigger on main</text>
    <text x="15" y="119" fill="#cbd5e1" font-size="10">• All 4 tests must pass</text>
    <text x="15" y="136" fill="#cbd5e1" font-size="10">• Render auto-deploy webhook</text>

    <path d="M 15 152 L 200 152" stroke="#334155" stroke-width="1"/>

    <text x="15" y="175" fill="#a7f3d0" font-size="11" font-weight="600">Live Production URL</text>
    <text x="15" y="195" fill="#38bdf8" font-size="9.5" font-weight="600">churn-prediction-ml-</text>
    <text x="15" y="210" fill="#38bdf8" font-size="9.5" font-weight="600">model-bkdm.onrender.com</text>
    <text x="15" y="228" fill="#34d399" font-size="9.5">Observed latency: ~3.4 ms</text>
  </g>
</svg>